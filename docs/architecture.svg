<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" width="1600" height="880" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .t{font-size:19px;font-weight:700;fill:#0f172a}
      .b{font-size:15px;fill:#475569}
      .s{font-size:13px;fill:#475569}
      .tag{font-size:12px;font-weight:700;letter-spacing:.06em;fill:#1d4ed8}
      .ln{stroke:#334155;stroke-width:2;fill:none}
      .dash{stroke-dasharray:6 5}
      .pill{fill:#eff6ff;stroke:#1d4ed8;stroke-width:1.5}
      .pt{font-size:15px;font-weight:700;fill:#1e3a8a}
    </style>
  </defs>

  <rect width="1600" height="880" fill="#f6f7f9"/>

  <!-- Title -->
  <text x="30" y="52" font-size="32" font-weight="800" fill="#0f172a">StormCheck — architecture</text>
  <text x="30" y="82" class="b">Is this hurricane alert real? Paste text or a screenshot → verified / suspicious / unverified, explained in English and Spanish.</text>

  <!-- ===== Client column ===== -->
  <rect x="30" y="130" width="300" height="100" rx="14" class="box"/>
  <text x="50" y="162" class="t">📱 Miami resident</text>
  <text x="50" y="188" class="b">Pastes an alert from WhatsApp,</text>
  <text x="50" y="208" class="b">SMS or social media (text / image)</text>

  <line x1="180" y1="230" x2="180" y2="286" class="ln" marker-end="url(#a)"/>

  <rect x="30" y="290" width="300" height="270" rx="14" fill="#0f172a"/>
  <text x="50" y="318" class="tag" fill="#93c5fd" style="fill:#93c5fd">VERCEL</text>
  <text x="50" y="345" font-size="19" font-weight="700" fill="#fff">Next.js PWA</text>
  <text x="50" y="375" font-size="15" fill="#cbd5e1">• EN / ES interface, installable</text>
  <text x="50" y="399" font-size="15" fill="#cbd5e1">• Service worker caches the app</text>
  <text x="50" y="423" font-size="15" fill="#cbd5e1">• Saves the latest official alerts</text>
  <rect x="50" y="445" width="260" height="92" rx="10" fill="#14532d"/>
  <text x="66" y="472" font-size="15" font-weight="700" fill="#dcfce7">Works offline</text>
  <text x="66" y="496" font-size="14" fill="#bbf7d0">No signal after the storm? An on-</text>
  <text x="66" y="516" font-size="14" fill="#bbf7d0">device classifier still flags scams</text>

  <line x1="180" y1="560" x2="180" y2="616" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="192" y="594" class="s">sign in (PKCE)</text>

  <rect x="30" y="620" width="300" height="100" rx="14" class="box"/>
  <text x="50" y="648" class="tag">AUTH0</text>
  <text x="50" y="674" class="t">Login for volunteers</text>
  <text x="50" y="700" class="b">Issues a JWT → "My history"</text>

  <!-- ===== Vultr container ===== -->
  <rect x="420" y="110" width="760" height="700" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="444" y="143" class="tag">VULTR VPS</text>
  <text x="530" y="143" class="b" font-weight="700" fill="#0f172a">Caddy (HTTPS) → Hono API on Node</text>

  <!-- Client ⇄ API -->
  <line x1="330" y1="370" x2="416" y2="370" class="ln" marker-end="url(#a)"/>
  <text x="375" y="358" class="s" text-anchor="middle">POST /verify</text>
  <line x1="420" y1="450" x2="334" y2="450" class="ln" marker-end="url(#a)"/>
  <text x="375" y="472" class="s" text-anchor="middle">verdict +</text>
  <text x="375" y="488" class="s" text-anchor="middle">EN/ES</text>
  <line x1="330" y1="675" x2="436" y2="675" class="ln dash" marker-end="url(#a)"/>
  <text x="375" y="664" class="s" text-anchor="middle">JWT</text>

  <!-- Step 1 -->
  <rect x="440" y="165" width="720" height="70" rx="12" class="box"/>
  <text x="460" y="195" class="t">1 · Read the screenshot</text>
  <text x="460" y="220" class="b">Gemini vision transcribes the alert text, sender, links and phone numbers</text>

  <!-- Step 2: swarm -->
  <rect x="440" y="255" width="720" height="185" rx="12" class="box"/>
  <text x="460" y="285" class="t">2 · Multi-agent swarm</text>
  <text x="680" y="285" class="b">Swarms SequentialWorkflow · gpt-4.1-mini</text>
  <rect x="460" y="330" width="150" height="60" rx="10" class="pill"/>
  <text x="535" y="366" class="pt" text-anchor="middle">Extractor</text>
  <rect x="640" y="330" width="150" height="60" rx="10" class="pill"/>
  <text x="715" y="358" class="pt" text-anchor="middle">Official</text>
  <text x="715" y="377" class="pt" text-anchor="middle">Matcher</text>
  <rect x="820" y="330" width="150" height="60" rx="10" class="pill"/>
  <text x="895" y="366" class="pt" text-anchor="middle">ScamDetector</text>
  <rect x="1000" y="330" width="140" height="60" rx="10" class="pill"/>
  <text x="1070" y="366" class="pt" text-anchor="middle">Judge</text>
  <line x1="610" y1="360" x2="636" y2="360" class="ln" marker-end="url(#a)"/>
  <line x1="790" y1="360" x2="816" y2="360" class="ln" marker-end="url(#a)"/>
  <line x1="970" y1="360" x2="996" y2="360" class="ln" marker-end="url(#a)"/>
  <text x="460" y="420" class="s">Compares against live NWS alerts for Florida · Judge returns label, confidence and reasons</text>

  <!-- Step 3 -->
  <rect x="440" y="460" width="720" height="70" rx="12" class="box"/>
  <text x="460" y="490" class="t">3 · Scam guardrail</text>
  <text x="460" y="515" class="b">Deterministic signals (payment, SSN, shady links) — a scam can never come out "verified"</text>

  <!-- Step 4 -->
  <rect x="440" y="550" width="720" height="70" rx="12" class="box"/>
  <text x="460" y="580" class="t">4 · Plain-language explanation</text>
  <text x="460" y="605" class="b">2–3 sentences in English + Spanish at a 6th-grade level, with what to do now</text>

  <!-- Step 5 -->
  <rect x="440" y="640" width="720" height="70" rx="12" class="box"/>
  <text x="460" y="670" class="t">5 · Save the check</text>
  <text x="460" y="695" class="b">Verifies the Auth0 JWT (JWKS) and stores the result in the user's history</text>

  <!-- verdicts -->
  <rect x="440" y="735" width="230" height="52" rx="26" fill="#15803d"/>
  <text x="555" y="767" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">✓ Verified</text>
  <rect x="685" y="735" width="230" height="52" rx="26" fill="#b45309"/>
  <text x="800" y="767" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">⚠ Suspicious</text>
  <rect x="930" y="735" width="230" height="52" rx="26" fill="#475569"/>
  <text x="1045" y="767" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">? Unverified</text>

  <!-- ===== External services ===== -->
  <rect x="1250" y="165" width="320" height="70" rx="12" class="box"/>
  <text x="1270" y="193" class="tag">GOOGLE GEMINI</text>
  <text x="1270" y="218" class="b">Vision + text generation</text>
  <line x1="1160" y1="200" x2="1246" y2="200" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect x="1250" y="255" width="320" height="80" rx="12" class="box"/>
  <text x="1270" y="284" class="tag">SWARMS API</text>
  <text x="1270" y="310" class="b">Runs the 4-agent workflow</text>
  <line x1="1160" y1="295" x2="1246" y2="295" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>

  <rect x="1250" y="355" width="320" height="85" rx="12" class="box"/>
  <text x="1270" y="384" class="tag">NATIONAL WEATHER SERVICE</text>
  <text x="1270" y="408" class="b">api.weather.gov — active</text>
  <text x="1270" y="428" class="b">alerts for Florida</text>
  <line x1="1250" y1="397" x2="1164" y2="397" class="ln" marker-end="url(#a)"/>

  <rect x="1250" y="550" width="320" height="70" rx="12" class="box"/>
  <text x="1270" y="578" class="tag">PRUNE GATEWAY</text>
  <text x="1270" y="603" class="b">Gemini via vaulted key · Shield · receipt</text>
  <line x1="1160" y1="585" x2="1246" y2="585" class="ln" marker-start="url(#a)" marker-end="url(#a)"/>
  <path d="M1570,585 H1588 V200 H1574" class="ln dash" marker-end="url(#a)"/>

  <rect x="1250" y="640" width="320" height="80" rx="12" class="box"/>
  <text x="1270" y="668" class="tag">TIGER DATA</text>
  <text x="1270" y="692" class="b">TimescaleDB hypertable of checks</text>
  <text x="1270" y="711" class="s">time_bucket stats per hour</text>
  <line x1="1160" y1="675" x2="1246" y2="675" class="ln" marker-end="url(#a)"/>

  <!-- footer -->
  <text x="30" y="850" class="s">Built with Swarms · Google Gemini · Vultr · Vercel · Auth0 · Tiger Data · Prune · NWS open data — SharkByte hackathon</text>
</svg>
